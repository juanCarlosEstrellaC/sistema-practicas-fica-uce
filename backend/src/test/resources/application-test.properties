# Base de Datos de Prueba (H2 - Memoria)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS auditoria
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Init
spring.sql.init.mode=never

# Hibernate Envers - Trazabilidad y Auditoria
spring.jpa.properties.jakarta.persistence.schema-generation.create-database-schemas=true
spring.jpa.properties.org.hibernate.envers.default_schema=auditoria
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Almacenamiento de Archivos
app.almacenamiento.ruta-base=build/archivos_subidos_test
