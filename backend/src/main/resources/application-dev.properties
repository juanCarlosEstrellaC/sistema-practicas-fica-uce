# ==============================================================
# Configuracion Especifica para Perfil de Desarrollo (dev)
# Especializa application.properties para desarrollo local.
# ==============================================================

# 1. Inicializacion Automatica de Base de Datos
# En desarrollo se reconstruye o actualiza el esquema y se cargan semillas
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:db/schema.sql

# Opciones de Semillas (elegir una sola fuente de verdad):
# - classpath:db/dummy_inicial.sql  -> Minimo (Admin Subdecano, usuarios base y 5 carreras)
# - classpath:db/dummy_completo.sql -> Completo (41 usuarios, convenios activos y proyectos VCS)
spring.sql.init.data-locations=classpath:db/dummy_inicial.sql
spring.jpa.defer-datasource-initialization=true

# 2. JPA / Hibernate en Desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
