# ==============================================================
# Configuracion Base de la Aplicacion (Spring Boot)
# Valores por defecto para produccion/base.
# Se sobreescriben automaticamente mediante variables de entorno o .env
# ==============================================================

spring.application.name=api_pp_uce
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Codificacion
logging.charset.console=UTF-8

# Servidor y Contexto Web
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/v1}

# Base de Datos (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prueba_1?stringtype=unspecified&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Almacenamiento y Limites de Subida de Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.almacenamiento.ruta-base=${APP_ALMACENAMIENTO_RUTA_BASE:archivos_subidos}

# Inicializacion SQL (Gestionado especificamente por cada perfil, ej: application-dev.properties)
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/dummy_inicial.sql
spring.jpa.defer-datasource-initialization=true

# Servicio de Correo (Por defecto: Mailpit local en localhost:1025)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@uce.edu.ec}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

# Seguridad y Autenticacion JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:28800000}
jwt.issuer=${JWT_ISSUER:api_pp_uce}
jwt.audience=${JWT_AUDIENCE:ppp_uce}

# Configuracion CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}


