# Configuracion de la Aplicacion
spring.application.name=api_pp_uce
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Codificación de la consola
logging.charset.console=UTF-8

# Base de Datos (PostgreSQL)
# [ORIGINAL] 
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/api_pp_db?stringtype=unspecified&prepareThreshold=0}
# [NUEVA DB] 
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prueba_1?stringtype=unspecified&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# [ORIGINAL] 
#spring.jpa.hibernate.ddl-auto=update
# [NUEVA DB]
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Hibernate Envers - Trazabilidad y Auditoria
spring.jpa.properties.org.hibernate.envers.default_schema=auditoria
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

server.port=8080
server.servlet.context-path=/api/v1

# Limites de subida de archivos multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Almacenamiento de Archivos
app.almacenamiento.ruta-base=${APP_ALMACENAMIENTO_RUTA_BASE:archivos_subidos}

# Sql Init
# [ORIGINAL] 
#spring.sql.init.mode=never
# [NUEVA DB] 
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:db/schema.sql
# Opciones disponibles para cargar datos (1 sola fuente de verdad):
# - classpath:db/dummy_inicial.sql (solo admin subdecano y datos minimos)
# - classpath:db/dummy_completo.sql (datos completos de usuarios y carreras)
# [ORIGINAL] spring.sql.init.data-locations=classpath:db/dummy_completo.sql
spring.sql.init.data-locations=classpath:db/dummy_inicial.sql
spring.jpa.defer-datasource-initialization=true

