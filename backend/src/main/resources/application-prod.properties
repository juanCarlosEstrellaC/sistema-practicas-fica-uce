# ==============================================================
# Configuracion Especifica para Perfil de Produccion / Demo (prod)
# ==============================================================

# 1. Inicializacion SQL deshabilitada en arranque de Spring Boot
# (En Docker Compose, postgres ejecuta schema.sql y dummy_inicial.sql una sola vez si el volumen esta vacio)
spring.sql.init.mode=never

# 2. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 3. Seguridad y JWT (obligatorio definir JWT_SECRET en el entorno)
jwt.secret=${JWT_SECRET}

# 4. URLs Publicas, CORS y Proxy Reverso (Cloudflare Tunnel)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.forward-headers-strategy=framework

# 5. Registro de Logs
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
