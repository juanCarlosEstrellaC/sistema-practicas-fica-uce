name: Integracion Continua (CI)

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - "desarrollo*"
  pull_request:
    branches:
      - main
      - "desarrollo*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot / JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 25 (Temurin) y cache de Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Dar permisos de ejecucion a Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias y de integracion
        run: ./gradlew test --no-daemon

      - name: Verificar empaquetado de produccion (bootJar)
        run: ./gradlew bootJar -x test --no-daemon

  frontend:
    name: Frontend (Next.js / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 y cache de npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm test

      - name: Verificar compilacion de produccion (Next.js build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: /api/proxy
        run: npm run build

  publicar-ghcr:
    name: Publicar Imagenes en GHCR
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen de backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/juancarlosestrellac/sistema-practicas-fica-uce/backend:${{ github.ref_name }}
            ghcr.io/juancarlosestrellac/sistema-practicas-fica-uce/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar imagen de frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=/api/proxy
          tags: |
            ghcr.io/juancarlosestrellac/sistema-practicas-fica-uce/frontend:${{ github.ref_name }}
            ghcr.io/juancarlosestrellac/sistema-practicas-fica-uce/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  desplegar-vps:
    name: Desplegar en VPS Azure
    needs: publicar-ghcr
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar contenedores en VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            if [ -n "${{ secrets.VPS_PROJECT_PATH }}" ]; then
              cd "${{ secrets.VPS_PROJECT_PATH }}"
            elif [ -d "$HOME/sistema-practicas-fica-uce" ]; then
              cd "$HOME/sistema-practicas-fica-uce"
            elif [ -d "/home/sistema-practicas-fica-uce" ]; then
              cd "/home/sistema-practicas-fica-uce"
            else
              echo "No se encontro la carpeta sistema-practicas-fica-uce. Configura el secret VPS_PROJECT_PATH." >&2
              exit 1
            fi
            ./scripts/desplegar-docker.sh "${{ github.ref_name }}"
